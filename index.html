<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地围棋记谱工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="board-panel">
      <canvas id="boardCanvas" width="760" height="760" aria-label="19x19 围棋棋盘"></canvas>
    </section>

    <aside class="side-panel">
      <h1>围棋记谱</h1>

      <div class="status-card">
        <div id="moveInfo">第 0 手 / 共 0 手</div>
        <div id="turnInfo">当前轮到：黑</div>
      </div>

      <label for="commentInput" class="label">当前手备注</label>
      <textarea id="commentInput" placeholder="从第 1 手开始记录备注" disabled></textarea>

      <div class="button-grid">
        <button id="firstBtn" type="button">回到第一手</button>
        <button id="lastBtn" type="button">跳到最后一手</button>
        <button id="prevBtn" type="button">上一手</button>
        <button id="nextBtn" type="button">下一手</button>
        <button id="undoBtn" type="button">Undo</button>
        <button id="redoBtn" type="button">Redo</button>
      </div>

      <div class="button-column">
        <button id="newGameBtn" type="button" class="danger">新建棋局</button>
        <button id="importBtn" type="button">导入 SGF</button>
        <input id="importFile" type="file" accept=".sgf" hidden />
        <button id="exportBtn" type="button">导出 SGF</button>
      </div>

      <div id="message" role="status" aria-live="polite"></div>
    </aside>
  </main>

  <script src="js/game.js"></script>
  <script src="js/board.js"></script>
  <script src="js/sgf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
